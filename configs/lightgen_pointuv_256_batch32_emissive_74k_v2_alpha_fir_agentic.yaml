# _v2 ALPHA AGENTIC **fir** (2026-08-23): the alpha-conditioned run on the AGENTIC-FILTERING
# training set, ported to Alliance Canada's fir (4x H100 80 GB) so it can start while
# cs-venus-19 is still occupied by another user's job until ~2026-08-27 18:00.
#
# THIS IS A SITE PORT OF lightgen_pointuv_256_batch32_emissive_74k_v2_alpha_venus19_agentic.yaml.
# It differs from that file ONLY in where things live and what the run is called:
#   1. tag                      -> ..._agentic_fir
#   2. exp_root_dir             -> a persistent /scratch path (fir has no repo-local outputs)
#   3-6. data_root / parquet / the three *_indices -> ${oc.env:SLURM_TMPDIR}/... (see below)
#   7. checkpoint.dirpath       -> persistent /scratch, NOT $SLURM_TMPDIR
#   8. the wandb block          -> ..._agentic_fir, tags gain "fir"
# EVERY training-relevant value is byte-identical to the venus-19 config: seed 42, per-GPU
# batch 32 x 4 GPUs = global 128, in_channels 13, use_alpha, LR 5e-4 / WD 0.01, T_max 34,380,
# max_epochs 125, precision bf16-mixed, save_top_k -1, every_n_epochs 5, num_workers 4.
#
# ⚠️ WHAT THIS PORT COSTS, STATED PLAINLY. The venus-19 run's claim is that it differs from
# the two cs-venus-05 arms in ONE variable (the training set) because the `texgen-bw` conda
# env is rsynced between those nodes for bit-identical library versions. fir forbids conda and
# uses module load + a virtualenv, so THIS run cannot make that claim: it is torch 2.9.0 /
# CUDA 12.6 against venus's torch 2.9.x / CUDA 12.9. Treat the fir number as an EARLY,
# same-recipe-different-site result. The venus-19 run remains the parity-clean number for the
# paper's dose-response; this one exists so the answer is not gated on one busy node.
#
# ⚠️ TEXGEN_ENABLE_FLASH=0 IS MANDATORY HERE AND THE LAUNCHER SETS IT. On cs-venus-05/19
# flash-attn is UNIMPORTABLE (sm_120, two failed source builds), so those runs take the dense
# attention path and the flag merely records that. On fir flash_attn 2.8.3 IMPORTS FINE, so
# leaving the flag unset would silently switch this run to a different attention kernel and
# different windowing -- a second changed variable, invisible in the loss curve.
#
# ⚠️ DATA LIVES IN $SLURM_TMPDIR, NOT ON /scratch. fir's binding constraint is its INODE quota:
# 789 K of 1,000 K used (measured 2026-08-23), i.e. ~211 K free, while the extracted training
# root is ~290 K inodes (72,421 shape dirs x {somage.npz, alpha.npy} + 72,421 thumbnails).
# It therefore CANNOT be extracted onto /scratch. The fir-native pattern applies instead: the
# 410 GB stays as 9 tars on /scratch (9 inodes) and the launcher extracts into $SLURM_TMPDIR
# (~7.2 TB node-local, no quota) at the start of every job segment. $SLURM_TMPDIR is WIPED at
# job end, which is exactly why checkpoint.dirpath below points at /scratch instead.
#
# Score at epoch 124 / step 35,500, same as the venus-19 run. Eval label for this site's rows:
# texgen_v2_alpha_agentic_fir_ep124 (do NOT reuse texgen_v2_alpha_agentic_ep124 -- that one is
# pre-registered for the venus-19 run and the two are different sites).
#
# Spec: docs/superpowers/specs/2026-08-22-agentic-filtered-baselines-retrain-design.md
# Split md5 159492b2b8d104ab63f3d13eeea394d0 (train 36,255 / val 387 / test 388).
#
# ---- inherited from the alpha baseline config, unchanged ----
#
# the alpha-conditioned TEXGen run. Identical in every
# training-relevant respect to lightgen_pointuv_256_batch32_emissive_74k_v2_venus05.yaml
# (its no-alpha counterpart, which becomes the "TEXGen without alpha" ablation row) except
# for ONE thing: the backbone additionally consumes a per-texel alpha (glTF opacity)
# channel, so in_channels goes 12 -> 13 and data.use_alpha is set.
#
# Input channel order (assembled in lightgen_system.forward + lightgen_pointuvnet.forward):
#   noisy_emission(3) + position(3) + albedo(3) + metal(1) + rough(1) + ALPHA(1) + mask(1)
# Alpha rides inside baked_texture (5 -> 6 ch) so it lands before the occupancy mask and
# gets the same [0,1] -> [-1,1] remap as albedo/metal/rough.
#
# NOTE in_channels: 13 ALSO describes the unrelated gt_mask_cond variant. The two are told
# apart by explicit flags, never by channel count: this run sets data.use_alpha=true and
# leaves backbone.use_gt_emission_mask_cond at its false default. Setting in_channels: 13
# without use_alpha would hand the model the GT emission mask it is trained to predict.
#
# Alpha provenance (74k append pass, complete 2026-08-12): 67,057 deterministic re-bake
# appends / 5,123 nearest-voxel backfills / 750 forced re-bakes. All 72,421 shapes in this
# split have alpha. Delivered on-node as an alpha.npy sidecar beside each somage.npz, so
# the staged 12ch tree stays byte-identical and the ablation row stays reproducible.
#
# Everything else — seed, split, parquet, T_max, max_epochs, LR/WD, batch, EMA, 4 GPUs —
# is copied verbatim to keep the comparison equal-compute.
#
# (Two clauses of that inherited sentence do NOT hold for this file, which is the whole
# point of it: the SPLIT is the _agentic one, and MAX_EPOCHS is 125 rather than 62 —
# precisely so that the step budget, the thing equal-compute actually means, stays equal.
# Everything else in the list is unchanged.)
#
name: lightgen
tag: "texgen_alpha_74k_v2_agentic_fir"
exp_root_dir: "/scratch/dya78/lightgen/texgen_runs"
seed: 42

# Resume on requeue / job restart.
auto_resume: true

# Data: 36,255 train / 387 val / 388 test, the availability-pinned newbake set with the
# agentic-filtering rejects removed from train. On fir the data paths resolve into
# $SLURM_TMPDIR, which is node-local, ~7.2 TB, outside the inode quota, and WIPED AT JOB
# END — so the launcher re-extracts the 410 GB from the tars on /scratch at the start of
# every segment (~15 min), and checkpoints go to /scratch instead.
#   - texgen_train_root/<shard>/<sha>/somage.npz  (a link to the bake's atlas.npz)
#   - texgen_train_root/thumbnails/<sha>.png      (CLIP conditioning; a MISSING file
#     does not raise — LightGenSystem warns and silently falls back to the albedo UV
#     map, which is how an early run trained 8 epochs on wrong conditioning)
# The split's indices are POSITIONAL into the parquet filtered to success==True, so
# the parquet must be exactly this df_SomgProc_final.parquet.
data_cls: spuv.data.lightgen_uv.LightGenDataModule
data:
  # ${oc.env:SLURM_TMPDIR} is resolved by OmegaConf at load time (omegaconf 2.3.0 on fir).
  # Outside a SLURM job this raises rather than silently pointing somewhere wrong.
  data_root: "${oc.env:SLURM_TMPDIR}/lightgen/data/texgen_train_root"
  parquet_file: "${oc.env:SLURM_TMPDIR}/lightgen/data/df_SomgProc_final.parquet"
  scene_list: ""
  eval_scene_list: ""
  repeat: 1
  vertex_transformation: false
  use_alpha: true            # emit alpha_map; requires alpha in the npz or an alpha.npy sidecar
  cond_views: 1
  sup_views: 4
  camera_strategy: "strategy_1"
  eval_cond_views: 1
  eval_sup_views: 4
  eval_camera_strategy: "strategy_test_1_to_4_90deg"

  # MUST be the availability-pinned file. The un-pinned stratified split references
  # shapes absent from this bake, and a missing npz does not fail loudly: __getitem__
  # catches, returns None, and collate_fn drops it — val/test silently shrink.
  #
  # The _agentic file is the availability-pinned split with heuristic filtering AND the
  # agentic QC workflow's rejects removed from its TRAIN block only; its val/test blocks
  # are copied through verbatim and are byte-identical to the split of record. So all
  # three keys point at ONE file, exactly as they did before — the val and test sets
  # this run is judged on are the baseline's, shape for shape.
  train_indices: "${oc.env:SLURM_TMPDIR}/lightgen/data/data_splits_emissive_74k_stratified_newbake_vae_agentic.json"
  val_indices: "${oc.env:SLURM_TMPDIR}/lightgen/data/data_splits_emissive_74k_stratified_newbake_vae_agentic.json"
  test_indices: "${oc.env:SLURM_TMPDIR}/lightgen/data/data_splits_emissive_74k_stratified_newbake_vae_agentic.json"

  height: 256
  width: 256
  uv_height: 256
  uv_width: 256
  batch_size: 32         # per-GPU; 1 node x 4 Pro 6000 = 4 ranks -> global 128
  eval_batch_size: 16    # global 64
  # ⚠️ H100 IS 80 GB, NOT 96 GB. The peak below was measured on a 96 GB Blackwell Max-Q;
  # 69.23 GB leaves ~10 GB of headroom on an H100 rather than ~26. The launcher runs a
  # short probe first for exactly this reason. If it OOMs, do NOT quietly drop per-GPU
  # batch — that breaks global batch 128; use the launcher's BS/NUM_GPUS guard instead.
  # per-GPU 32 CONFIRMED BY MEASUREMENT on cs-venus-05 (2026-07-29, 4 training steps
  # on one RTX PRO 6000 Blackwell Max-Q, 97,887 MiB):
  #   fit_start        allocated  6.64 GB
  #   before_backward  allocated 54.06 GB, free 40.91 GB
  #   epoch_end        PEAK      69.23 GB  -> ~26 GB headroom, no OOM
  # So this matches the reference run's per-GPU batch exactly, with no accumulation.
  #
  # Do NOT re-derive this from the H100 table in TEXGen/CLAUDE.md (static ~14 GB +
  # 1.37 GB/sample): that model underestimates on the torch-2.9 stack — it predicted
  # 35.9 GB for micro-batch 16 where an L40S actually peaked at 41.99 GB and OOM'd.
  # A two-point fit of real L40S measurements projected ~65 GB here; the measured
  # 69.23 GB is close, but the number in this config is the measured one.
  #
  # 4 workers x 4 ranks = 16 processes, down from 24. Each dataloader worker holds a
  # copy of the 824,858-row sample index that _load_from_parquet builds, so worker
  # count multiplies host RAM directly — job 237314 died OUT_OF_MEMORY at exactly its
  # 200G ceiling. The GPU is the bottleneck here (5-6 s/step), not the loader, so
  # fewer workers should not cost throughput; raise it again only if the loader
  # visibly lags.
  num_workers: 4

system_cls: spuv.systems.lightgen_system.LightGenSystem
system:
  condition_drop_rate: 0.1
  rescale_betas_zero_snr: true
  use_ema: true
  ema_decay: 0.9999
  val_with_ema: true
  render_background_color: [0.0, 0.0, 0.0]
  train_regression: false
  recon_warm_up_steps: 0
  prediction_type: "v_prediction"
  check_train_every_n_steps: 1000
  test_save_json: false
  test_save_mid_result: false
  cleanup_after_validation_step: true

  test_cfg_scale: 2.0
  test_num_steps: 50
  guidance_rescale: 0.0
  guidance_interval: [0.0, 1.0]

  cond_rgb_perturb: false

  image_tokenizer_cls: spuv.models.tokenizers.clip.ClipTokenizer
  image_tokenizer:
    pretrained_model_name_or_path: "lambdalabs/sd-image-variations-diffusers"

  backbone_cls: spuv.models.sparse_networks.lightgen_pointuvnet.LightGenPointUVNet
  backbone:
    in_channels: 13
    out_channels: 3
    num_layers: [1, 1, 1, 1, 1]
    point_block_num: [1, 1, 2, 4, 6]
    block_out_channels: [32, 256, 1024, 1024, 2048]
    dropout: [0.0, 0.0, 0.0, 0.1, 0.1]
    block_type: ["uv", "point_uv", "uv_dit", "uv_dit", "uv_dit"]
    voxel_size: [0.01, 0.02, 0.05, 0.05, 0.05]
    window_size: [0, 128, 128, 256, 256]
    num_heads: [4, 4, 16, 16, 16]
    skip_input: true
    skip_type: "adaptive"
    use_uv_head: true

  loss:
    diffusion_loss_dict:
      lambda_mse: 1.0
      lambda_l1: 0.5
      lambda_dark_region: 0.0
      emissive_threshold: 0.001
    render_loss_dict:
      lambda_render_lpips: 0.0
      lambda_render_mse: 0.0
      lambda_render_l1: 0.0
    use_min_snr_weight: false
    use_vgg: false

  optimizer:
    name: AdamW
    args:
      lr: 5e-4
      betas: [0.9, 0.999]
      weight_decay: 0.01

  scheduler:
    name: CosineAnnealingLR
    interval: step
    args:
      # FROZEN 2026-07-29. T_max = 34,380 optimizer steps = exactly the compute the
      # superseded baseline actually received (its checkpoint stores global_step
      # 34,380 = 573 steps/epoch x 60 epochs at the same global batch 128). So this
      # run replaces that model at equal compute, and unlike it the cosine reaches
      # eta_min instead of stopping at LR 7.4e-5 three quarters of the way down.
      #
      # Anchored to STEPS, not wall-clock, so it does not depend on a throughput
      # estimate. max_epochs = ceil(34380 / 560) = 62.
      #
      # DO NOT EDIT once training starts: T_max is read from the config on every
      # resume while scheduler.last_epoch comes from the checkpoint, so changing it
      # mid-run warm-restarts the LR — the exact defect the old run carried.
      T_max: 34380
      eta_min: 1e-6

trainer:
  # 125 = the smallest max_epochs that (a) covers T_max 34,380 and (b) ends on a
  # scheduled save epoch (every_n_epochs 5 -> epochs 4, 9, ..., 124), with
  # 284 = ceil(36255 / 128) steps/epoch on the agentic train set: 125 x 284 = 35,500
  # steps vs the heuristic run's 70 x 494 = 34,580 and the baseline's 62 x 560 = 34,720.
  #
  # The extra ~1,120 steps run PAST T_max, and torch's stock CosineAnnealingLR turns
  # back UP there rather than holding eta_min -- MEASURED by replaying this exact
  # schedule (torch 2.6): LR is 1.00e-6 at step 34,380 and 2.31e-6 at step 35,500. That
  # is not eta_min, but it is ~200x below base LR 5e-4, and it is the SAME regime the
  # other two arms are scored in: the unfiltered baseline's epoch 59 (step 33,600) sits
  # at 1.63e-6 and the heuristic run's epoch 69 (step 34,580) at 1.04e-6. All three
  # scored checkpoints are deep in the cosine tail; none is learning fast enough for the
  # step-count difference to confound the comparison. Do not restate this as "at eta_min".
  #
  # (122 would cover T_max but its last epoch 121 is not a save; 120 ends on a save but
  # stops 300 steps short.) SCORE AT epoch 124 / step 35,500 vs the heuristic run's
  # epoch 69 / step 34,580 and the baseline's epoch 59 / step 33,600 — all in the
  # cosine tail. The step budget is what governs, and it is what is being held equal —
  # see the header.
  max_epochs: 125
  check_val_every_n_epoch: 1    # 284 steps/epoch at global batch 128 (heuristic: 494, baseline: 560)
  num_sanity_val_steps: 2
  precision: bf16-mixed
  gradient_clip_val: 1.0
  num_nodes: 1
  log_every_n_steps: 50

checkpoint:
  # A NEW directory, and that is load-bearing: auto_resume globs this path for a
  # last*.ckpt, and the baseline's directory already holds one at step 33,600. Pointing
  # here at the baseline's dirpath would silently resume a different run instead of
  # training this one.
  # ON /scratch, NOT $SLURM_TMPDIR: TMPDIR is wiped at job end, so a checkpoint written
  # there would vanish on every requeue and auto_resume would silently cold-start.
  dirpath: "/scratch/dya78/lightgen/texgen_runs/output_emissive_74k_alpha_v2_agentic_fir/"
  save_last: true
  # -1 = keep EVERY scheduled save, unconditionally.
  #
  # save_top_k: 5 with monitor: val/psnr silently STOPPED checkpointing entirely.
  # val/psnr peaks early on sparse emission (an all-dark prediction scores well) and
  # then oscillates lower, so once five early checkpoints held the top-5 slots no
  # later epoch could beat them — Lightning skipped the save, and last.ckpt stopped
  # refreshing with it. Observed on job 237655: nothing written between epoch 24 and
  # epoch 32, and on that trajectory the run would have finished 62 epochs with no
  # final checkpoint at all, since epoch 59 (the last scheduled save) is subject to
  # the same suppression.
  #
  # 25 saves (epochs 4..124) x 12.4 GB = ~310 GB on fir /scratch, which has ~14 TiB free
  # (4640 GiB of 19 TiB used). Cost in INODES is 25 files — irrelevant against the quota.
  save_top_k: -1
  every_n_epochs: 5
  monitor: "val/psnr"
  mode: "max"
  save_on_train_epoch_end: false

wandb:
  project: "LightGen"
  name: "texgen_alpha_74k_v2_agentic_fir"
  tags: ["baseline", "from_scratch", "emissive_74k_v2", "newbake", "stratified_split", "alpha_cond", "nonzero_train", "nonzero_nocopy_train", "agentic_train", "fir"]
  notes: "TEXGen alpha-conditioned on the regenerated uv_voxel 74k bake, trained on the AGENTIC-FILTERING training set (36,255 train / 387 val / 388 test, split md5 159492b2b8d104ab63f3d13eeea394d0). SITE PORT of texgen_alpha_74k_v2_agentic onto fir (4x H100 80 GB) so the run can start while cs-venus-19 is occupied until ~2026-08-27. Every training-relevant value is byte-identical to the venus-19 config: seed 42, global batch 128, in_channels 13, use_alpha, LR 5e-4 / WD 0.01, T_max 34,380, max_epochs 125 = 35,500 steps, score at epoch 124. CAVEAT: fir forbids conda, so this run does NOT have the bit-identical texgen-bw library stack the venus-19 run rsyncs from cs-venus-05 (fir is torch 2.9.0 / CUDA 12.6). It is an EARLY same-recipe-different-site result; texgen_alpha_74k_v2_agentic on cs-venus-19 remains the parity-clean number for the paper. TEXGEN_ENABLE_FLASH=0 is set by the launcher and is load-bearing here: flash_attn 2.8.3 imports on fir but not on the venus nodes, so leaving it unset would change the attention path as a second variable."
