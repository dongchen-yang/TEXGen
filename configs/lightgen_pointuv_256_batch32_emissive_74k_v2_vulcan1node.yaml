# _v2 vulcan-1node (2026-07-29): vanilla retrain on the REGENERATED uv_voxel bake,
# on VULCAN — 1 node x 4 L40S (48 GB), micro-batch 16 x accumulate_grad_batches 2
# -> GLOBAL BATCH 128, which is the 4x H100 reference this baseline was trained at
# (its config comment says 573 steps/epoch, and 573 x 60 epochs = 34,380 = the
# reference checkpoint's stored global_step). The superseded vulcan variant of this
# file used per-GPU 4 x 8 ranks = global 32; that was a 4x error, sized around the
# L40S's 48 GB rather than around the reference recipe.
#
# Data = staged texgen_train_root on node-local SSD (atlas.npz linked as somage.npz
# under the parquet's ditem_dir nesting) + the availability-pinned newbake split,
# the same one both emission DiTs train on — so this run is finally comparable to
# them head-to-head. 71,646 train / 387 val / 388 test; 560 steps/epoch.
#
# Only data paths / per-GPU batch / num_nodes / output paths differ from
# lightgen_pointuv_256_batch32_emissive_74k.yaml.
#
name: lightgen
tag: "texgen_vanilla_74k_v2"
exp_root_dir: "outputs"
seed: 42

# Resume on requeue / job restart.
auto_resume: true

# Data: 71,646 train / 387 val / 388 test = 72,421, the availability-pinned newbake
# cohort. All paths are absolute on cs-venus-05's node-local /localscratch, which is
# PERSISTENT on star2 — the 410 GB is extracted once and survives jobs and requeues
# (unlike fir, where $SLURM_TMPDIR is wiped per job and must be re-staged).
#   - texgen_train_root/<shard>/<sha>/somage.npz  (a link to the bake's atlas.npz)
#   - texgen_train_root/thumbnails/<sha>.png      (CLIP conditioning; a MISSING file
#     does not raise — LightGenSystem warns and silently falls back to the albedo UV
#     map, which is how an early run trained 8 epochs on wrong conditioning)
# The split's indices are POSITIONAL into the parquet filtered to success==True, so
# the parquet must be exactly this df_SomgProc_final.parquet.
data_cls: spuv.data.lightgen_uv.LightGenDataModule
data:
  data_root: "/REPLACED_BY_SLURM_TMPDIR/texgen_train_root"
  parquet_file: "/scratch/dya78/lightgen_repo/data/df_SomgProc_final.parquet"
  scene_list: ""
  eval_scene_list: ""
  repeat: 1
  vertex_transformation: false
  cond_views: 1
  sup_views: 4
  camera_strategy: "strategy_1"
  eval_cond_views: 1
  eval_sup_views: 4
  eval_camera_strategy: "strategy_test_1_to_4_90deg"

  # MUST be the availability-pinned file. The un-pinned stratified split references
  # shapes absent from this bake, and a missing npz does not fail loudly: __getitem__
  # catches, returns None, and collate_fn drops it — val/test silently shrink.
  train_indices: "/scratch/dya78/lightgen_repo/data/data_splits_emissive_74k_stratified_newbake_vae.json"
  val_indices: "/scratch/dya78/lightgen_repo/data/data_splits_emissive_74k_stratified_newbake_vae.json"
  test_indices: "/scratch/dya78/lightgen_repo/data/data_splits_emissive_74k_stratified_newbake_vae.json"

  height: 256
  width: 256
  uv_height: 256
  uv_width: 256
  batch_size: 8          # micro-batch; 4 L40S x 8 x accumulate 4 -> global 128
  eval_batch_size: 4
  # MEASURED on this stack, not extrapolated. Job 217827 ran micro-batch 16 and
  # OOM'd: peak 41.99 GB against an L40S's usable 44.39 GiB (not 48 — ECC/reserved
  # overhead), with `before_backward` showing only 2.82 GB free. The H100-derived
  # model (static ~14 GB + 1.37 GB/sample => 35.9 GB) UNDERESTIMATES here; the real
  # slope is nearer 2 GB/sample, and the 74k long tail has heavier-than-average
  # shapes on top of that.
  #
  # Micro-batch 8 => roughly 26 GB, leaving ~18 GB of headroom for the tail, and
  # accumulate_grad_batches: 4 restores the global batch to 128. Staying on ONE node
  # is the point: reaching 128 with a full per-GPU batch would need 8 ranks, i.e.
  # two nodes, i.e. the cross-node NCCL rendezvous that has never worked here
  # (job 83679 requeued ~19 times without reaching step 0).
  #
  # 6 workers x 4 ranks = 24 of the 48 allocated CPUs (node has 128); bump if the
  # loader lags the GPUs.
  num_workers: 6

system_cls: spuv.systems.lightgen_system.LightGenSystem
system:
  condition_drop_rate: 0.1
  rescale_betas_zero_snr: true
  use_ema: true
  ema_decay: 0.9999
  val_with_ema: true
  render_background_color: [0.0, 0.0, 0.0]
  train_regression: false
  recon_warm_up_steps: 0
  prediction_type: "v_prediction"
  check_train_every_n_steps: 1000
  test_save_json: false
  test_save_mid_result: false
  cleanup_after_validation_step: true

  test_cfg_scale: 2.0
  test_num_steps: 50
  guidance_rescale: 0.0
  guidance_interval: [0.0, 1.0]

  cond_rgb_perturb: false

  image_tokenizer_cls: spuv.models.tokenizers.clip.ClipTokenizer
  image_tokenizer:
    pretrained_model_name_or_path: "lambdalabs/sd-image-variations-diffusers"

  backbone_cls: spuv.models.sparse_networks.lightgen_pointuvnet.LightGenPointUVNet
  backbone:
    in_channels: 12
    out_channels: 3
    num_layers: [1, 1, 1, 1, 1]
    point_block_num: [1, 1, 2, 4, 6]
    block_out_channels: [32, 256, 1024, 1024, 2048]
    dropout: [0.0, 0.0, 0.0, 0.1, 0.1]
    block_type: ["uv", "point_uv", "uv_dit", "uv_dit", "uv_dit"]
    voxel_size: [0.01, 0.02, 0.05, 0.05, 0.05]
    window_size: [0, 128, 128, 256, 256]
    num_heads: [4, 4, 16, 16, 16]
    skip_input: true
    skip_type: "adaptive"
    use_uv_head: true

  loss:
    diffusion_loss_dict:
      lambda_mse: 1.0
      lambda_l1: 0.5
      lambda_dark_region: 0.0
      emissive_threshold: 0.001
    render_loss_dict:
      lambda_render_lpips: 0.0
      lambda_render_mse: 0.0
      lambda_render_l1: 0.0
    use_min_snr_weight: false
    use_vgg: false

  optimizer:
    name: AdamW
    args:
      lr: 5e-4
      betas: [0.9, 0.999]
      weight_decay: 0.01

  scheduler:
    name: CosineAnnealingLR
    interval: step
    args:
      # FROZEN 2026-07-29. T_max = 34,380 optimizer steps = exactly the compute the
      # superseded baseline actually received (its checkpoint stores global_step
      # 34,380 = 573 steps/epoch x 60 epochs at the same global batch 128). So this
      # run replaces that model at equal compute, and unlike it the cosine actually
      # reaches eta_min instead of stopping at LR 7.4e-5 three quarters of the way
      # down.
      #
      # Anchored to STEPS, not wall-clock, which is why the rough throughput estimate
      # does not endanger it. Measured on one L40S: ~3 s per micro-batch steady state
      # after a ~3 min nvrtc warm-up => ~12 s per optimizer step (4 micro-batches)
      # => ~1.9 h per 560-step epoch => ~5 days for 62 epochs across 24 h slices.
      # A throughput error changes how many days, not whether T_max is right.
      #
      # DO NOT EDIT once training starts: T_max is read from the config on every
      # resume while scheduler.last_epoch comes from the checkpoint, so changing it
      # mid-run warm-restarts the LR.
      T_max: 34380
      eta_min: 1e-6

trainer:
  # 4 ranks x micro-batch 8 x 4 = global 128. Lightning counts OPTIMIZER steps as
  # global_step, so steps/epoch and T_max keep their meaning: 71,646 / 128 = 560.
  accumulate_grad_batches: 4
  max_epochs: 62     # ceil(34380 / 560); the step budget is what governs
  check_val_every_n_epoch: 1    # 560 steps/epoch at global batch 128
  num_sanity_val_steps: 2
  precision: bf16-mixed
  gradient_clip_val: 1.0
  num_nodes: 1
  log_every_n_steps: 50

checkpoint:
  dirpath: "/scratch/dya78/lightgen_repo/TEXGen/output_emissive_74k_vanilla_v2_vulcan/"
  save_last: true
  save_top_k: 5
  every_n_epochs: 5
  monitor: "val/psnr"
  mode: "max"
  save_on_train_epoch_end: false

wandb:
  project: "LightGen"
  tags: ["baseline", "from_scratch", "emissive_74k", "pinned_val_test"]
  notes: "74k scaling: 73251 train / 112 val / 109 test (val+test pinned to 1k baseline). 4× H100 DDP, per-GPU bs=32, global bs=128, 256x256. Extended to 350 epochs on 2026-04-30 to match paper-equivalent compute; LR/WD unchanged from original 5e-4/0.01."
