name: lightgen
tag: "pointuv_256res_batch32_emissive_74k"
exp_root_dir: "outputs"
seed: 42

# Resume on requeue / job restart.
auto_resume: true

# Data: 73,251 train / 112 val / 109 test from the 74,353-sample emissive-complete pool.
# Val/test are pinned to the 1k baseline's val/test for direct PSNR comparability.
# data_root, parquet_file, *_indices are absolute paths and assume:
#   - NPZ tars extracted to ${SLURM_TMPDIR}/baked_uv/<shard>/<id>/somage.npz   (ditem_dir layout)
#   - df_SomgProc_final.parquet on /home/dya78/scratch/lightgen/data/
#   - data_splits_emissive_74k_pinned.json shipped via git
# slurm_train_74k.sh overrides data_root with the actual SLURM_TMPDIR at runtime.
data_cls: spuv.data.lightgen_uv.LightGenDataModule
data:
  data_root: "/REPLACED_BY_SLURM_TMPDIR/baked_uv"
  parquet_file: "/home/dya78/scratch/lightgen/data/df_SomgProc_final.parquet"
  scene_list: ""
  eval_scene_list: ""
  repeat: 1
  vertex_transformation: false
  cond_views: 1
  sup_views: 4
  camera_strategy: "strategy_1"
  eval_cond_views: 1
  eval_sup_views: 4
  eval_camera_strategy: "strategy_test_1_to_4_90deg"

  train_indices: "/home/dya78/scratch/lightgen/data_processing/annotation/data_splits_emissive_74k_pinned.json"
  val_indices: "/home/dya78/scratch/lightgen/data_processing/annotation/data_splits_emissive_74k_pinned.json"
  test_indices: "/home/dya78/scratch/lightgen/data_processing/annotation/data_splits_emissive_74k_pinned.json"

  height: 256
  width: 256
  uv_height: 256
  uv_width: 256
  batch_size: 32
  eval_batch_size: 16
  # 4-GPU DDP: each rank spawns its own workers. 6 per rank × 4 ranks = 24 workers,
  # leaving ~24 of 48 allocated CPUs free — conservative; bump if loading lags GPU.
  num_workers: 6

system_cls: spuv.systems.lightgen_system.LightGenSystem
system:
  condition_drop_rate: 0.1
  rescale_betas_zero_snr: true
  use_ema: true
  ema_decay: 0.9999
  val_with_ema: true
  render_background_color: [0.0, 0.0, 0.0]
  train_regression: false
  recon_warm_up_steps: 0
  prediction_type: "v_prediction"
  check_train_every_n_steps: 1000
  test_save_json: false
  test_save_mid_result: false
  cleanup_after_validation_step: true

  test_cfg_scale: 2.0
  test_num_steps: 50
  guidance_rescale: 0.0
  guidance_interval: [0.0, 1.0]

  cond_rgb_perturb: false

  image_tokenizer_cls: spuv.models.tokenizers.clip.ClipTokenizer
  image_tokenizer:
    pretrained_model_name_or_path: "lambdalabs/sd-image-variations-diffusers"

  backbone_cls: spuv.models.sparse_networks.lightgen_pointuvnet.LightGenPointUVNet
  backbone:
    in_channels: 12
    out_channels: 3
    num_layers: [1, 1, 1, 1, 1]
    point_block_num: [1, 1, 2, 4, 6]
    block_out_channels: [32, 256, 1024, 1024, 2048]
    dropout: [0.0, 0.0, 0.0, 0.1, 0.1]
    block_type: ["uv", "point_uv", "uv_dit", "uv_dit", "uv_dit"]
    voxel_size: [0.01, 0.02, 0.05, 0.05, 0.05]
    window_size: [0, 128, 128, 256, 256]
    num_heads: [4, 4, 16, 16, 16]
    skip_input: true
    skip_type: "adaptive"
    use_uv_head: true

  loss:
    diffusion_loss_dict:
      lambda_mse: 1.0
      lambda_l1: 0.5
      lambda_dark_region: 0.0
      emissive_threshold: 0.001
    render_loss_dict:
      lambda_render_lpips: 0.0
      lambda_render_mse: 0.0
      lambda_render_l1: 0.0
    use_min_snr_weight: false
    use_vgg: false

  optimizer:
    name: AdamW
    args:
      lr: 5e-4
      betas: [0.9, 0.999]
      weight_decay: 0.01

  scheduler:
    name: CosineAnnealingLR
    interval: step
    args:
      # 4× H100 DDP, per-GPU bs=32 → global batch 128.
      # 73251 train / 128 = ceil = 573 steps/epoch × 80 epochs ≈ 45840 total steps.
      # T_max == total steps so LR cosines from lr → eta_min over the full run.
      T_max: 45840
      eta_min: 1e-6

trainer:
  max_epochs: 80
  check_val_every_n_epoch: 1    # 4-GPU epoch is ~573 steps (~50 min) — validate each epoch
  num_sanity_val_steps: 2
  precision: bf16-mixed
  gradient_clip_val: 1.0
  num_nodes: 1
  log_every_n_steps: 50

checkpoint:
  dirpath: "/home/dya78/scratch/lightgen/TEXGen/output_emissive_74k_vanilla/"
  save_last: true
  save_top_k: 5
  every_n_epochs: 5
  monitor: "val/psnr"
  mode: "max"
  save_on_train_epoch_end: false

wandb:
  project: "LightGen"
  tags: ["baseline", "from_scratch", "emissive_74k", "pinned_val_test"]
  notes: "74k scaling: 73251 train / 112 val / 109 test (val+test pinned to 1k baseline). 4× H100 DDP, per-GPU bs=32, global bs=128, 256x256, 80 epochs."
