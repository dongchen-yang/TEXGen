name: lightgen
tag: "pointuv_overfit10_mask_cls_lambda001_balanced"
exp_root_dir: "outputs"
seed: 42
use_timestamp: false

auto_resume: true

custom_output_dir: "outputs/overfit10_mask_cls_lambda001_balanced"

# Data configuration - 10 samples for overfitting test
data_cls: spuv.data.lightgen_uv.LightGenDataModule
data:
  data_root: "../data/baked_uv_local_subset"
  parquet_file: "../data/baked_uv_local_subset/df_SomgProc_emission_filtered.parquet"
  scene_list: ""
  eval_scene_list: ""
  repeat: 1
  vertex_transformation: false
  cond_views: 1
  sup_views: 4
  camera_strategy: "strategy_1"
  eval_cond_views: 1
  eval_sup_views: 4
  eval_camera_strategy: "strategy_test_1_to_4_90deg"

  train_indices: "../data/baked_uv_local_subset/overfit_split_10.json"
  val_indices: "../data/baked_uv_local_subset/overfit_split_10.json"
  test_indices: "../data/baked_uv_local_subset/overfit_split_10.json"

  height: 256
  width: 256
  uv_height: 256
  uv_width: 256
  batch_size: 10
  num_workers: 2

# System configuration
system_cls: spuv.systems.lightgen_system.LightGenSystem
system:
  condition_drop_rate: 0.0
  rescale_betas_zero_snr: true
  use_ema: false
  ema_decay: 0.9999
  val_with_ema: false
  render_background_color: [0.0, 0.0, 0.0]
  train_regression: false
  recon_warm_up_steps: 0
  prediction_type: "v_prediction"
  check_train_every_n_steps: 10
  test_save_json: false
  test_save_mid_result: false
  cleanup_after_validation_step: true

  test_cfg_scale: 2.0
  test_num_steps: 50
  guidance_rescale: 0.0
  guidance_interval: [0.0, 1.0]

  cond_rgb_perturb: false

  # Image tokenizer
  image_tokenizer_cls: spuv.models.tokenizers.clip.ClipTokenizer
  image_tokenizer:
    pretrained_model_name_or_path: "lambdalabs/sd-image-variations-diffusers"

  # Backbone: LightGenPointUVNet (small architecture for overfitting)
  backbone_cls: spuv.models.sparse_networks.lightgen_pointuvnet.LightGenPointUVNet
  backbone:
    in_channels: 12
    out_channels: 3

    num_layers: [1, 1, 1]
    point_block_num: [1, 1, 2]
    block_out_channels: [32, 128, 256]
    dropout: [0.0, 0.0, 0.0]

    block_type: ["uv", "point_uv", "uv_dit"]
    voxel_size: [0.01, 0.02, 0.05]
    window_size: [0, 128, 128]
    num_heads: [4, 4, 8]

    skip_input: true
    skip_type: "adaptive"
    use_uv_head: true

  # Loss configuration
  loss:
    diffusion_loss_dict:
      lambda_mse: 1.0
      lambda_l1: 0.5
      lambda_dark_region: 0.0
      emissive_threshold: 0.001
      # --- VARIANT: mask classification loss (lambda=0.01) with class balancing ---
      lambda_pred_mask_cls: 0.01
      mask_cls_threshold: 0.01
      mask_cls_balanced: true  # Upweight minority (emissive) class via pos_weight
    render_loss_dict:
      lambda_render_lpips: 0.0
      lambda_render_mse: 0.0
      lambda_render_l1: 0.0
    use_min_snr_weight: false
    use_vgg: false

  # Optimizer
  optimizer:
    name: AdamW
    args:
      lr: 5e-4
      betas: [0.9, 0.999]
      weight_decay: 0.0

  # Learning rate scheduler
  scheduler:
    name: CosineAnnealingLR
    interval: step
    args:
      T_max: 10000
      eta_min: 1e-6

# Trainer configuration
trainer:
  max_epochs: 10000
  check_val_every_n_epoch: 100
  num_sanity_val_steps: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  num_nodes: 1
  log_every_n_steps: 1

# Checkpoint configuration
checkpoint:
  save_last: true
  save_top_k: 2
  every_n_epochs: 5
  monitor: "val/psnr"
  mode: "max"
  save_on_train_epoch_end: false

# Wandb configuration (use --wandb flag to enable)
wandb:
  project: "LightGen"
  tags: ["overfit10", "mask_cls_loss", "lambda001", "balanced"]
  notes: "Mask cls loss lambda=0.01 with class-balanced BCE (pos_weight=num_neg/num_pos). 10 samples, batch_size=10, 10k epochs."
